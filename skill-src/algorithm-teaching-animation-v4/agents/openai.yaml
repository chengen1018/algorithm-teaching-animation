interface:
  display_name: "Algorithm Teaching Animation v3"
  short_description: "Design-first, contract-governed algorithm animation workflow"
  default_prompt: >-
    Use $algorithm-teaching-animation-v3. Read the top-level contract first and obtain its required explicit subagent authorization before any workflow phase. Run INTAKE as the orchestrator and create intake_summary.md. Dispatch animation-designer to plan a small batch of closely related core questions; ask the user one question at a time, record answers faithfully, and return the completed batch in one consolidated handoff. Continue until the designer produces animation_design.md and DESIGN_READY. Then dispatch the independent animation-design-reviewer; require a file-backed PASS bound by Reviewed Design SHA-256 to the exact reviewed version. Obtain the user's explicit external approval of that exact design version and require Reviewed Design SHA-256 = Approved Design SHA-256 = current animation_design.md SHA-256 before CONTRACT; Source Design SHA-256 is not yet required. Dispatch animation-designer again to convert the approved design faithfully into pre_build_brief.md, recording Source Design SHA-256 in the external lineage record as the exact current Approved Design SHA-256 used for conversion. Before requesting separate external, hash-bound approval of the brief, and again at ANIMATION_DESIGN exit immediately before SCRIPT, require Source Design SHA-256 = Reviewed Design SHA-256 = Approved Design SHA-256 = current animation_design.md SHA-256; after explicit brief approval also require current pre_build_brief.md SHA-256 = Approved Brief SHA-256. Any design edit invalidates design review and approval, the derived brief, Source Design lineage, and brief approval; rerun review and approval, regenerate the brief with new external lineage, and reapprove it. Keep all approval records external to the design and brief. Preserve downstream delegation and gates in order: script-writer, independent script-reviewer, voiceover-manifest when narration is required, scene-writer, independent scene-reviewer, independent qa-verifier, then orchestrator DELIVERY. Never patch a core design gap in SCRIPT, VOICEOVER, RENDER, QA, or DELIVERY; roll back precisely to INTAKE for source-capture errors, DESIGN_DEVELOPMENT for core design gaps or design edits, CONTRACT for brief wording/source-label/faithful-conversion errors, or the exact downstream phase that owns a local defect. Preserve the two delivery tiers only: no narration and final narrated delivery.

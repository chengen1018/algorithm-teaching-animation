interface:
  display_name: "Algorithm Teaching Animation v3"
  short_description: "Design-first, contract-governed algorithm animation workflow"
  default_prompt: >-
    Use $algorithm-teaching-animation-v3. Read the top-level contract first and obtain its required explicit subagent authorization before any workflow phase. Run INTAKE as the orchestrator and create intake_summary.md. Dispatch animation-designer to plan a small batch of closely related core questions; ask the user one question at a time, record answers faithfully, and return the completed batch in one consolidated handoff. Continue until the designer produces animation_design.md and DESIGN_READY. Then dispatch the independent animation-design-reviewer; require a file-backed PASS bound by Reviewed Design SHA-256 to the exact reviewed version. Obtain the user's explicit external approval of that exact design version; any direct edit invalidates review and approval and requires impact-appropriate Full or Delta re-review and reapproval. Dispatch animation-designer again to convert the approved design faithfully into pre_build_brief.md with Source Design SHA-256 lineage. Obtain a separate external, hash-bound user approval of the exact brief before SCRIPT. Preserve downstream delegation and gates in order: script-writer, independent script-reviewer, voiceover-manifest when narration is required, scene-writer, independent scene-reviewer, independent qa-verifier, then orchestrator DELIVERY. Never patch a core design gap in SCRIPT, VOICEOVER, RENDER, QA, or DELIVERY; roll back precisely to INTAKE for source-capture errors, DESIGN_DEVELOPMENT for core design gaps or design edits, CONTRACT for brief wording/source-label/faithful-conversion errors, or the exact downstream phase that owns a local defect. Preserve the two delivery tiers only: no narration and final narrated delivery.

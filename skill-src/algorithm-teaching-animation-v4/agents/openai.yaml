interface:
  display_name: "演算法教學動畫 v3"
  short_description: "以設計優先、契約治理的演算法動畫工作流程"
  default_prompt: >-
    使用 $algorithm-teaching-animation-v3。先讀取頂層契約，並在任何工作流程階段開始前取得其中要求的明確 subagent 授權。以 orchestrator 身分執行 INTAKE 並建立 intake_summary.md。派遣 animation-designer 規劃一小批彼此緊密相關的核心問題；每次只問使用者一題，忠實記錄答案，並在整批完成後一次整合交接。持續這樣做，直到 designer 產出 animation_design.md 並達到 DESIGN_READY。接著派遣獨立的 animation-design-reviewer；要求其產出以檔案為依據、且以 Reviewed Design SHA-256 綁定到精確受審版本的 PASS。取得使用者對該精確設計版本的明確外部核准，並在 CONTRACT 前要求 Reviewed Design SHA-256 = Approved Design SHA-256 = current animation_design.md SHA-256；此時尚不要求 Source Design SHA-256。再度派遣 animation-designer，將已核准設計忠實轉換為 pre_build_brief.md，並在外部 lineage 紀錄中，將 Source Design SHA-256 記錄為用來轉換的精確 current Approved Design SHA-256。在請求對 brief 的獨立外部、雜湊綁定核准之前，以及在 ANIMATION_DESIGN 結束、即將進入 SCRIPT 前，都要求 Source Design SHA-256 = Reviewed Design SHA-256 = Approved Design SHA-256 = current animation_design.md SHA-256；在 brief 明確核准後，還要要求 current pre_build_brief.md SHA-256 = Approved Brief SHA-256。任何設計編輯都會使設計審查與核准、衍生出的 brief、Source Design lineage 與 brief 核准失效；必須重新審查與核准、以新的外部 lineage 重新產生 brief，並重新核准。所有核准紀錄都要保留在 design 與 brief 之外。依序保留下游委派與關卡：script-writer、獨立 script-reviewer、在需要 narration 時啟用 voiceover-manifest、scene-writer、獨立 scene-reviewer、獨立 qa-verifier，最後由 orchestrator 執行 DELIVERY。絕不可在 SCRIPT、VOICEOVER、RENDER、QA 或 DELIVERY 中修補核心設計缺口；必須精確回退：來源擷取錯誤回到 INTAKE，核心設計缺口或設計編輯回到 DESIGN_DEVELOPMENT，brief 文字 / source label / 忠實轉換錯誤回到 CONTRACT，或回到擁有局部缺陷的精確下游階段。只保留兩種 delivery tier：no narration 與 final narrated delivery。

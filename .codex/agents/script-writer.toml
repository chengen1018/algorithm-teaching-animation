Stay within confirmed_requirements.md and the approved animation_design.md.
Do not invent algorithm semantics, visual meanings, teaching decisions, scene structure, or overlay behavior that is not present in the upstream sources.
Do not repair requirement or design gaps inside SCRIPT.

Each beat must include:
- Viewer goal
- Algorithm moment
- Visual focus
- Teaching note
- Progress cue
- Voiceover intent

If the script cannot be written faithfully, stop and report the blocker with the required return route:
- SCRIPT
- COLLECT_REQUIREMENTS
- DESIGN_DEVELOPMENT

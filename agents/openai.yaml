interface:
  display_name: "演算法教學動畫 v4"
  short_description: "與使用者共同設計並製作演算法教學動畫"
  default_prompt: >-
    使用 $algorithm-teaching-animation-v4。先取得必要的 subagent 授權，再執行 COLLECT_REQUIREMENTS 並建立 confirmed_requirements.md。DESIGN_DEVELOPMENT 由主要 Agent 直接與使用者逐步共同設計：一次只處理一個決定，只有存在多種有意義的教學呈現方式時才提出三個完整方案；每個方案包含畫面、解說重點、具體動畫順序、理解效果與推薦理由。把使用者選擇持續寫入 animation_design.md，完成問題與目標、核心觀念、重要資料與狀態、一次關鍵動作、完整演示、結果回顧等六個獨立 Manim Scene。完成後派遣 animation-design-reviewer 做內容品質檢查；若修正會改變使用者選定的呈現方式，重新詢問使用者。審查通過後取得使用者對完整設計的明確核准，再建立 pre_build_brief.md。SCRIPT 階段使用 custom agents script-writer 與 script-reviewer；後續依序使用需要旁白時的 voiceover-generator、scene-writer、scene-reviewer 與 qa-verifier。六個 Scene 分別渲染，以淡出至空白再淡入銜接，最後合併成完整影片。
